<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio: Vera</title>
  <link rel="icon" type="image/x-icon" href="./assets/svg/logo.svg">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="dark">
    <div class="container container-header">
      <a href="/" class="header__logo">
      <img src="./assets/svg/logo.svg" alt="logo">
      </a>
      <nav class="header__nav">
        <ul class="header__list">
          <li class="header__list-item">
            <a href="" class="list-link">about me</a>
          </li>
          <li class="header__list-item">
            <a href="" class="list-link">portfolio</a>
          </li>
          <li class="header__list-item">
            <a href="" class="list-link">price</a>
          </li>
          <li class="header__list-item">
            <a href="" class="list-link">faq</a>
          </li>
          <li class="header__list-item">
            <a href="" class="list-link">contacts</a>
          </li>
        </ul>
      </nav>
  </div>
  </header>

  <main>
    <section class="hero dark">
      <div class="container container-hero">
        <div class="hero__side__arrow">
          <div class="arrow__year">2025</div>
          <span></span>
          <div class="arrow__text">Best Photographer by MAX</div>
        </div>
        <div class="hero__main-container">
          <div class="hero-main">
            <div class="hero__stat-container">
              <div class="hero__stat-item">
                <span>+</span>
                <div class="hero__stat__item-container">
                  <div class="hero__stat-number">487</div>
                  <div class="hero__stat-text">Photo sessions</div>
                </div>
              </div>
              <div class="hero__stat-item">
                <span>+</span>
                <div class="hero__stat__item-container">
                  <div class="hero__stat-number">356</div>
                  <div class="hero__stat-text">Satisfied clients</div>
                </div>
              </div>
            </div>
            <h1>Professional photographer</h1>
            <h3>Capture the Moment. Tell Your Story.</h3>
          </div>
          <div class="scroll__container">
            <a href="/" class="hero__scroll">Scroll down</a>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 5V19" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19 12L12 19L5 12" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <img class="hero__second__img" src="./assets/img/hero-second.png" alt="Vera">
        <div class="hero__main__container">
          <img src="./assets/img/hero-first.webp" alt="Vera">
          <div class="hero__intro">Hi! I’m Vera, a photographer. For me, photography is more than just an image.</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
